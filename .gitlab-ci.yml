# CI for lean-spec.
#
#   verify          `lake build` (library plus both executables) and `lake test`
#                   on merge requests, on the default branch, and on tags. This
#                   turns the changelog's standing claim -- builds clean, passes
#                   the suite -- into a check rather than an assertion, on Linux,
#                   a second platform from the macOS development machine.
#
#   kernel-check    `lake check --paranoid`, sandboxed. Builds and exports the
#                   default target (the library, demos and test modules) inside a
#                   `bwrap` sandbox and replays the export through every checker
#                   bundled with Lean: its kernel, the hardened-allocator kernel,
#                   lean4lean, nanoda, and the verified kernels con-leche and
#                   con-ron. Fails on any checker rejection or on any axiom beyond
#                   the standard ones, so a `native_decide` anywhere fails the
#                   pipeline. See docs/lake-check-paranoid-report.md.
#
#                   The sandbox needs Linux user namespaces, which Docker's
#                   default seccomp profile blocks. The job therefore needs a
#                   runner that starts job containers privileged; GitLab.com's
#                   shared Linux runners do (that is also what `build-ci-image`'s
#                   docker-in-docker relies on). On a self-managed runner set
#                   `privileged = true` for the docker executor. Never pass
#                   `--inadvisably-no-sandbox` here.
#
#   build-ci-image  Manual. Builds ci/Dockerfile and pushes it to this project's
#                   Container Registry, then prints the digest to pin.
#
# The first pipeline needs no preparation: the jobs run on a plain Debian image
# and install the toolchain named in `lean-toolchain`, cached between runs.
# Once `build-ci-image` has run once, set the project variable LEAN_CI_IMAGE to
# the pushed image -- pinned by digest, e.g.
#
#   registry.gitlab.com/bevisera/lean-spec/ci:v4.35.0@sha256:<digest>
#
# and the install steps become no-ops.

stages:
  - verify
  - image

variables:
  # Overridden by a project variable once the pinned image exists.
  LEAN_CI_IMAGE: "debian:bookworm-slim"
  # GitLab caches only paths under $CI_PROJECT_DIR, so elan has to live there.
  # The import firewall scans LeanSpec/ only, so this is invisible to the suite.
  ELAN_HOME: "$CI_PROJECT_DIR/.elan"
  GIT_DEPTH: "50"

.lean-env:
  image: $LEAN_CI_IMAGE
  interruptible: true
  cache:
    key:
      files:
        - lean-toolchain
    paths:
      - .elan/
  before_script:
    - export PATH="$ELAN_HOME/bin:$PATH"
    - |
      if ! command -v cc > /dev/null 2>&1 || ! command -v bwrap > /dev/null 2>&1; then
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git build-essential bubblewrap
        rm -rf /var/lib/apt/lists/*
      fi
    # `lake check` binds /run/user into its sandbox; slim images lack it.
    - mkdir -p /run/user
    - |
      if ! command -v lake > /dev/null 2>&1; then
        curl -sSfL https://elan.lean-lang.org/elan-init.sh \
          | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
      fi
    - lean --version
    - lake --version
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

verify:
  extends: .lean-env
  stage: verify
  timeout: 45m
  script:
    - lake build
    - lake build lean-spec lean-spec-verification
    - lake test

kernel-check:
  extends: .lean-env
  stage: verify
  timeout: 60m
  variables:
    # Keep the toolchain outside the project: with it under $CI_PROJECT_DIR,
    # `lake check` stalls at "Resolving dependencies". /opt/elan is where the
    # pinned image already has it; without the image it is installed each run.
    ELAN_HOME: "/opt/elan"
  cache: []
  script:
    # Sandboxed: builds and exports inside bwrap. No --from-export, no
    # --inadvisably-no-sandbox.
    # Exit status is lake's, not a pipe's.
    - status=0; lake check --paranoid > lake-check.log 2>&1 || status=$?; cat lake-check.log; exit $status
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - lake-check.log

build-ci-image:
  stage: image
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - when: manual
      allow_failure: true
  script:
    - TOOLCHAIN="$(cat lean-toolchain)"
    - TAG="${TOOLCHAIN##*:}"
    - IMAGE="$CI_REGISTRY_IMAGE/ci:$TAG"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --build-arg "LEAN_TOOLCHAIN=$TOOLCHAIN" -t "$IMAGE" ci
    - docker push "$IMAGE"
    # Pin LEAN_CI_IMAGE to this, not to the tag.
    - docker image inspect "$IMAGE" --format 'pin LEAN_CI_IMAGE to {{index .RepoDigests 0}}'
